plugins:
  - rubocop-rails

Rails:
  Exclude:
    - '{test,spec}/**/app/**/*.rb'

Style/Documentation:
  Exclude:
    - app/**/application_*.rb
    - app/models/**/current.rb
    - lib/**/engine.rb
    - '{db,test,spec}/**/*.rb'

Lint/ConstantDefinitionInBlock:
  inherit_mode:
    merge:
      - AllowedMethods
  AllowedMethods:
    - concern
    - concerning
Naming/PredicatePrefix:
  inherit_mode:
    merge:
      - AllowedMethods
  AllowedMethods:
    - has_one
    - has_many
    - has_and_belongs_to_many
